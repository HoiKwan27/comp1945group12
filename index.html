<style>
:root{--bg:#eef1f5;--card:#ffffff;--ink:#0f1f33;--muted:#5b6b80;--line:#d6dde6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1524;--card:#12233a;--ink:#e8eef6;--muted:#9fb0c4;--line:#274462;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1524;--card:#12233a;--ink:#e8eef6;--muted:#9fb0c4;--line:#274462;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.muted{color:var(--muted)}
.gold{color:#b8962e}
.btn,.btn-gold{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;border:0;transition:filter .15s}
.btn{background:#003366;color:#fff}
.btn-gold{background:#D4AF37;color:#003366}
.btn:hover,.btn-gold:hover{filter:brightness(1.12)}
.btn:disabled,.btn-gold:disabled{opacity:.55;cursor:default}
.btn:focus-visible,.btn-gold:focus-visible,input:focus-visible{outline:2px solid #D4AF37;outline-offset:2px}
.field{background:transparent;border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--ink);width:100%}
@keyframes fill{from{width:0}to{width:100%}}
.bar{animation:fill 1.5s linear forwards}
@keyframes pulse{50%{opacity:.5}}
.pulse{animation:pulse 1s infinite}
@media (prefers-reduced-motion:reduce){.bar,.pulse{animation:none;width:100%}}
</style>

 rice:{label:'Rice Cooker',cat:'Kitchenware > Rice Cooker',title:'Panasonic 1.0L Mini Rice Cooker',score:88,grade:'Very Good',note:'Very Good - Non-stick pot intact, minor outer scuff',base:122,lo:110,hi:134,min:70,max:180,shape:'r',demo:'#c05621'}
};
const PRE={
 kettle:[
  {id:'k1',title:'Philips 1.5L Electric Kettle',score:94,grade:'Mint',price:85,loc:'UG Hall I - Lobby',img:IMG.k1},
  {id:'k2',title:'Philips 1.7L Black Double-Wall Kettle',score:89,grade:'Good',price:78,loc:'Jockey Club Hall - G/F',img:IMG.k2},
  {id:'k3',title:'Philips 1.7L Bronze Electric Kettle',score:82,grade:'Fair',price:95,loc:'PG Hall 2 - Entrance',img:IMG.k3}],
 rice:[
  {id:'r1',title:'Panasonic 1.0L Rice Cooker',score:94,grade:'Mint',price:118,loc:'UG Hall I - Lobby',img:IMG.r2},
  {id:'r2',title:'Mini Smart Rice Cooker 0.8L',score:89,grade:'Good',price:105,loc:'Jockey Club Hall - G/F',img:IMG.r1},
  {id:'r3',title:'Aonija 1.0L Rice Cooker',score:82,grade:'Fair',price:125,loc:'PG Hall 2 - Entrance',img:IMG.r3}]
};
const Pill=({c,children})=><span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold ${c}`}>{children}</span>;

const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
const shrink=(img,max=640)=>{
 const W=img.naturalWidth,H=img.naturalHeight,k=Math.min(1,max/Math.max(W,H));
 const c=document.createElement('canvas');c.width=Math.round(W*k);c.height=Math.round(H*k);
 const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
 return c.toDataURL('image/jpeg',0.85);
};
// Silhouette analyzer: grayscale only, colour is never used.
// Thresholds were calibrated on sample photos; tune here if needed.
const TALL_MIN=1.12,HANDLE_MIN=0.07;
const analyze=img=>{
 const W=img.naturalWidth,H=img.naturalHeight,k=Math.min(1,128/Math.max(W,H));
 const w=Math.max(8,Math.round(W*k)),h=Math.max(8,Math.round(H*k));
 const c=document.createElement('canvas');c.width=w;c.height=h;
 const x=c.getContext('2d',{willReadFrequently:true});
 x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
 const px=x.getImageData(0,0,w,h).data,g=new Float32Array(w*h);
 for(let i=0;i<w*h;i++)g[i]=.299*px[i*4]+.587*px[i*4+1]+.114*px[i*4+2];
 const bd=[];
 for(let i=0;i<w;i++)bd.push(g[i],g[(h-1)*w+i]);
 for(let j=0;j<h;j++)bd.push(g[j*w],g[j*w+w-1]);
 bd.sort((a,b)=>a-b);const bg=bd[bd.length>>1];
 const m=new Uint8Array(w*h),rc=new Int32Array(h),cc=new Int32Array(w);
 for(let y=1;y<h-1;y++)for(let i=1;i<w-1;i++){
  const q=y*w+i;
  if(Math.abs(g[q]-bg)>28||Math.abs(g[q+1]-g[q-1])+Math.abs(g[q+w]-g[q-w])>40){m[q]=1;rc[y]++;cc[i]++;}
 }
 let y0=-1,y1=-1,x0=-1,x1=-1;
 for(let y=0;y<h;y++)if(rc[y]>=2){if(y0<0)y0=y;y1=y;}
 for(let i=0;i<w;i++)if(cc[i]>=2){if(x0<0)x0=i;x1=i;}
 if(y0<0||x0<0||y1-y0<4||x1-x0<4)return null;
 const bw=x1-x0+1,bh=y1-y0+1;
 // Row centres of the silhouette: a side handle or spout drags the centre sideways, a plain round body does not
 const cs=[];
 for(let y=y0;y<=y1;y++){
  let a=-1,b=-1;
  for(let i=x0;i<=x1;i++)if(m[y*w+i]){if(a<0)a=i;b=i;}
  if(a>=0&&b-a>=0.25*bw)cs.push((a+b)/2);
 }
 if(cs.length<4)return null;
 cs.sort((p,q)=>p-q);
 const pc=f=>cs[Math.min(cs.length-1,Math.floor(f*cs.length))];
 const hw=bh/bw,shift=(pc(0.9)-pc(0.1))/bw;
 // Kettle = tall AND has a side handle. Anything squarer or without a side handle = rice cooker.
 const kettle=hw>=TALL_MIN&&shift>=HANDLE_MIN;
 const cl=v=>Math.max(0,Math.min(1,v));
 const cf=kettle?Math.min(cl((hw-TALL_MIN)/0.2),cl((shift-HANDLE_MIN)/0.08)):Math.max(cl((TALL_MIN-hw)/0.2),cl((HANDLE_MIN-shift)/0.08));
 return {type:kettle?'kettle':'rice',conf:Math.round(55+40*cf)};
};
function Seller({onList}){
 const [step,setStep]=useState(1),[scan,setScan]=useState(false),[item,setItem]=useState(null),[title,setTitle]=useState(''),[price,setPrice]=useState(0),[done,setDone]=useState(false),[drag,setDrag]=useState(false);
 const fileRef=useRef();
 const d=item?T[item.type]:null;
 const start=async src=>{
  setScan(true);
  const wait=new Promise(r=>setTimeout(r,1500));
  let res={type:'kettle',conf:50,img:src};
  try{const im=await loadImg(src);const a=analyze(im)||{type:'kettle',conf:50};res={type:a.type,conf:a.conf,img:shrink(im)};}catch(e){}
  await wait;
  setItem({type:res.type,img:res.img,conf:res.conf,manual:false});setTitle(T[res.type].title);setPrice(T[res.type].base);setDone(false);setScan(false);setStep(2);
 };
 const onFile=f=>{
  if(!f||!(/^image\/(jpeg|png|webp)$/.test(f.type)||/\.(jpe?g|png|webp)$/i.test(f.name)))return;
  const r=new FileReader();
  r.onload=()=>start(r.result);
  r.readAsDataURL(f);
 };
 const switchTo=k=>{if(k===item.type)return;setTitle(t=>t===T[item.type].title?T[k].title:t);setPrice(T[k].base);setItem({...item,type:k,manual:true});};
 const st=d&&(price<d.lo?{c:'bg-blue-100 text-blue-800',t:'Sell Faster Price • Instant Buyer Match'}:price>d.hi?{c:'bg-amber-100 text-amber-800',t:'Maximize Value • May Take Longer to Sell'}:{c:'bg-green-100 text-green-800',t:'Fair Market Range (+/- 10%) • High Sell Probability'});
 const confirm=()=>{
  onList({id:'n'+Date.now(),type:item.type,img:item.img,title:title||d.title,price:Number(price)||d.base,score:d.score,grade:d.grade,loc:'UG Hall II - Locker #B04',isNew:true});
  setDone(true);
 };
 const reset=()=>{setStep(1);setItem(null);setDone(false);if(fileRef.current)fileRef.current.value='';};
 return <div>
  <div className="flex items-center gap-2 mb-3 flex-wrap">
   <h2 className="font-bold text-lg">Seller portal: <span className="gold">AI Smart Listing</span></h2>
   <div className="flex gap-1 ml-auto text-xs">{['Upload','Passport','Price'].map((s,i)=><span key={s} className={`px-2.5 py-1 rounded-full font-semibold ${step===i+1?'bg-[#003366] text-white':step>i+1?'bg-[#D4AF37] text-[#003366]':'card muted'}`}>{i+1}. {s}</span>)}</div>
  </div>
  {step===1&&<div className="grid md:grid-cols-3 gap-3">
   <div role="button" tabIndex={0} className={`md:col-span-2 rounded-xl border-2 border-dashed p-6 text-center cursor-pointer bg-[var(--card)] ${drag?'border-[#D4AF37]':'border-[var(--line)]'}`}
    onClick={()=>!scan&&fileRef.current.click()} onKeyDown={e=>e.key==='Enter'&&!scan&&fileRef.current.click()}
    onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={()=>setDrag(false)} onDrop={e=>{e.preventDefault();setDrag(false);!scan&&onFile(e.dataTransfer.files[0])}}>
    {scan?<div className="py-4"><div className="pulse font-semibold mb-3">Scanning Object Geometry &amp; Silhouette...</div><div className="h-2 rounded-full bg-[var(--line)] overflow-hidden max-w-sm mx-auto"><div className="bar h-full bg-[#D4AF37]"></div></div></div>
    :<div className="py-3 flex flex-col items-center gap-1"><span className="text-[#003366] dark:text-[#D4AF37]"><I d={P.up} s={30}/></span><b>Drag a photo here or click to choose</b><span className="text-sm muted">JPG, PNG or WEBP. We detect the item from its shape, not its color.</span></div>}
    <input ref={fileRef} type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" hidden onChange={e=>onFile(e.target.files[0])}/>
   </div>
   <div className="card p-4 flex flex-col gap-2 justify-center">
    <span className="text-sm muted">No photo handy? Use a demo item.</span>
    <button className="btn" disabled={scan} onClick={()=>start(IMG.k1)}>Demo: Sample Kettle</button>
    <button className="btn" disabled={scan} onClick={()=>start(IMG.r2)}>Demo: Sample Rice Cooker</button>
   </div>
  </div>}
  {step===2&&item&&<div className="card p-4 grid md:grid-cols-[200px_1fr] gap-4">
   <img src={item.img} alt="Uploaded item" className="rounded-xl w-full h-40 md:h-44 object-contain bg-white"/>
   <div className="space-y-2">
    <div className="flex items-center gap-2 flex-wrap"><span className="text-[#003366] dark:text-[#D4AF37]"><I d={P.shield}/></span><b>Item Health Passport</b><Pill c="bg-green-100 text-green-800"><I d={P.check} s={12}/>{item.manual?'Category set manually':`AI Silhouette Match: ${item.conf}% Confidence`}</Pill></div>
    <div className="flex items-center gap-2 flex-wrap text-xs"><span className="muted">Switch Category:</span><div className="inline-flex rounded-full border overflow-hidden" style={{borderColor:'var(--line)'}}>{['kettle','rice'].map(k=><button key={k} onClick={()=>switchTo(k)} className={`px-3 py-1 font-semibold ${item.type===k?'bg-[#003366] text-white':'bg-[var(--card)]'}`}>{T[k].label}</button>)}</div></div>
    <div className="text-sm"><span className="muted">Category: </span><b>{d.cat}</b></div>
    <div className="text-sm"><span className="muted">Condition score: </span><b>{d.score}/100</b> ({d.note})</div>
    <label className="text-sm muted block" htmlFor="ttl">Item title</label>
    <input id="ttl" className="field" value={title} onChange={e=>setTitle(e.target.value)}/>
    <button className="btn" onClick={()=>setStep(3)}>Next: Set Smart Price</button>
   </div>
  </div>}
  {step===3&&item&&<div className="card p-4 space-y-3">
   <div className="flex gap-3 items-center"><img src={item.img} alt="" className="w-16 h-16 rounded-lg object-contain bg-white"/><div><b>{title}</b><div className="text-sm muted">Hall market average HK${d.base}. Sweet spot (+/- 10%): <b className="gold">HK${d.lo} – HK${d.hi}</b></div></div></div>
   <div className="flex items-center gap-3">
    <input type="range" aria-label="Price" className="flex-1 accent-[#D4AF37]" min={d.min} max={d.max} value={Math.min(d.max,Math.max(d.min,price||d.min))} onChange={e=>setPrice(Number(e.target.value))}/>
    <label className="flex items-center gap-1 border rounded-lg px-2 py-1 w-28" style={{borderColor:'var(--line)'}}><span className="muted text-sm">HK$</span><input type="number" min="0" className="w-full bg-transparent outline-none" value={price===0?'':price} onChange={e=>setPrice(Math.max(0,Number(e.target.value)||0))}/></label>
   </div>
   <div className="flex justify-between text-xs muted"><span>HK${d.min}</span><span>HK${d.max}</span></div>
   <Pill c={st.c}>{st.t}</Pill>
   <div className="flex gap-2 flex-wrap items-center">
    <button className="btn-gold" disabled={done} onClick={confirm}>Confirm &amp; Assign Drop-Off Locker</button>
    {done&&<button className="btn" onClick={reset}>List another item</button>}
   </div>
   {done&&<div className="rounded-lg bg-green-100 text-green-900 px-3 py-2 text-sm flex items-center gap-2"><I d={P.check}/><span><b>Assigned Drop-off: UG Hall II Smart Locker #B04.</b> Your item now shows in the buyer portal below.</span></div>}
  </div>}
 </div>;
}

function QR({seed=849201}){
 const n=21,out=[];let s=seed;
 const rnd=()=>(s=(s*1103515245+12345)%2147483648)/2147483648;
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){
  let on,z=null;
  if(x<8&&y<8)z=[x,y];else if(x>=13&&y<8)z=[x-14,y];else if(x<8&&y>=13)z=[x,y-14];
  if(z){const[dx,dy]=z;on=dx>=0&&dy>=0&&dx<=6&&dy<=6&&(dx===0||dx===6||dy===0||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4));}
  else on=rnd()>0.5;
  if(on)out.push(<rect key={x+'-'+y} x={x} y={y} width="1" height="1"/>);
 }
 return <svg viewBox="-2 -2 25 25" className="w-44 h-44 rounded-lg" role="img" aria-label="Locker QR code"><rect x="-2" y="-2" width="25" height="25" fill="#fff"/><g fill="#003366">{out}</g></svg>;
}

function Buyer({mine}){
 const [q,setQ]=useState('Kettle'),[m,setM]=useState(null),[ok,setOk]=useState(false),[paid,setPaid]=useState(false);
 const kind=/rice|cooker/i.test(q)?'rice':(/kettle/i.test(q)||!q.trim())?'kettle':null;
 const list=kind?[...mine.filter(x=>x.type===kind),...PRE[kind].map(p=>({...p,type:kind}))].slice(0,3):[];
 const deal=x=>x.price<=T[x.type].base*0.9;
 return <div>
  <h2 className="font-bold text-lg mb-3">Buyer portal: <span className="gold">Dorm Marketplace &amp; Locker Pickup</span></h2>
  <div className="flex gap-2 flex-wrap items-center mb-3">
   <label className="flex items-center gap-2 card px-3 py-2 flex-1 min-w-[200px]"><span className="muted"><I d={P.search}/></span><input aria-label="Search listings" className="bg-transparent outline-none w-full" value={q} onChange={e=>setQ(e.target.value)} placeholder="Search kettles, rice cookers..."/></label>
   {['Kettle','Rice Cooker'].map(c=><button key={c} onClick={()=>setQ(c)} className={`px-3 py-1.5 rounded-full text-sm font-semibold border ${(c==='Kettle'?kind==='kettle':kind==='rice')?'bg-[#003366] text-white border-[#003366]':'card'}`}>{c}</button>)}
  </div>
  {!kind&&<div className="card p-4 muted text-sm">No matches yet. Try “Kettle” or “Rice Cooker”.</div>}
  <div className="grid sm:grid-cols-3 gap-3">
   {list.map(x=><div key={x.id} className="card overflow-hidden flex flex-col">
    <div className="relative">
     <img src={x.img} alt={x.title} className="w-full h-32 object-contain bg-white"/>
     {x.isNew&&<span className="absolute top-2 left-2 bg-[#D4AF37] text-[#003366] text-[10px] font-bold px-2 py-0.5 rounded">NEW LISTING</span>}
     <span className="absolute top-2 right-2 bg-[#003366] text-white text-xs font-semibold px-2 py-0.5 rounded-full">{x.score}/100 {x.grade}</span>
    </div>
    <div className="p-3 flex flex-col gap-1.5 flex-1">
     <b className="text-sm leading-tight">{x.title}</b>
     <div className="flex items-center gap-2 flex-wrap"><span className="text-lg font-bold">HK${x.price}</span>{deal(x)?<Pill c="bg-green-100 text-green-800">Great Deal</Pill>:<Pill c="bg-sky-100 text-sky-800">Fair Price</Pill>}</div>
     <div className="text-xs muted flex items-center gap-1"><I d={P.pin} s={14}/>{x.loc}</div>
     <button className="btn mt-auto" onClick={()=>{setM(x);setOk(false);setPaid(false)}}>Buy</button>
    </div>
   </div>)}
  </div>
  {m&&<div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4" onClick={()=>setM(null)}>
   <div className={`card w-full max-w-md p-5 space-y-3 max-h-full overflow-auto ${paid?'border-t-4 !border-t-green-500':''}`} role="dialog" aria-modal="true" onClick={e=>e.stopPropagation()}>
    <div className="flex items-start justify-between gap-2"><h3 className={`font-bold text-lg flex items-center gap-2 ${paid?'text-green-600':''}`}>{paid&&<I d={P.check} s={22}/>}{paid?'Payment Received':'Payment Code'}</h3><button aria-label="Close" className="muted" onClick={()=>setM(null)}><I d={P.x}/></button></div>
    <div className="flex gap-3 items-center"><img src={m.img} alt="" className="w-14 h-14 rounded-lg object-contain bg-white"/><div><b className="text-sm">{m.title}</b><div className="text-sm muted">Price: <b className="text-[var(--ink)]">HK${m.price}</b></div></div></div>
    {!paid?<>
     <div className="flex flex-col items-center gap-2 py-1"><QR seed={120345}/><div className="text-xs muted">Demo QR code, not scannable</div></div>
     <button className="btn-gold w-full" onClick={()=>setPaid(true)}>Paid</button>
    </>:<>
     <div className="flex flex-col items-center gap-2 py-1">
      <QR/>
      <div className="text-sm muted">Smart Locker pickup QR</div>
     </div>
     <div className="flex items-center gap-2 text-sm"><I d={P.pin}/><span>Locker location: <b>UG Hall I - Locker #A12</b></span></div>
     <div className="text-center"><div className="text-sm muted">One-time PIN</div><div className="text-2xl font-bold tracking-widest">849-201</div></div>
     <div className="flex items-center gap-2 text-sm"><span className="text-green-600"><I d={P.shield}/></span><span><b>Item Health Passport verified.</b> Condition {m.score}/100 ({m.grade})</span></div>
     <div className={`rounded-lg px-3 py-2 text-sm flex items-center gap-2 ${ok?'bg-green-100 text-green-900':'bg-amber-100 text-amber-900'}`}><I d={ok?P.unlock:P.lock}/>{ok?'Locker #A12 Unlocked! Please collect your item.':'Locker #A12 is locked. Scan the QR code or enter the PIN.'}</div>
     <button className="btn-gold w-full" disabled={ok} onClick={()=>setOk(true)}>Simulate Locker Unlock</button>
    </>}
   </div>
  </div>}
 </div>;
}

function App(){
 const [mine,setMine]=useState([]);
 return <div className="md:h-screen md:flex md:flex-col">
  <header className="bg-[#003366] text-white px-4 py-2.5 flex items-center gap-3 flex-wrap">
   <span className="text-[#D4AF37]"><I d={P.spark} s={22}/></span>
   <b className="text-lg">HallSwap <span className="text-[#D4AF37]">HKUST</span></b>
   <span className="text-sm text-white/75">AI second-hand marketplace with smart lockers for residential halls. Prototype demo.</span>
  </header>
  <main className="md:flex-1 md:min-h-0 md:grid md:grid-rows-2">
   <section className="p-4 md:overflow-auto border-b-4 border-[#D4AF37]"><Seller onList={x=>setMine(p=>[x,...p])}/></section>
   <section className="p-4 md:overflow-auto"><Buyer mine={mine}/></section>
  </main>
 </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
